ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    Alias /api /var/www/html/api
    <Directory /var/www/html/api>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    Alias /table /var/www/html/table
    <Directory /var/www/html/table>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Ninguna respuesta PHP debe permanecer en caché: contiene sesión o datos de MySQL.
    <FilesMatch "\.php$">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </FilesMatch>

    # Las herramientas HTML bajo /table también muestran resultados dinámicos.
    <LocationMatch "^/table(?:/|$)">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </LocationMatch>

    # El navegador siempre debe comprobar si existe una nueva versión del Service Worker.
    <Location "/service-worker.js">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
        Header always set Service-Worker-Allowed "/"
    </Location>

    <Location "/api/desembarques/observaciones_stream.php">
        SetEnv no-gzip 1
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        Header always set X-Accel-Buffering "no"
    </Location>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
