services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-America/Monterrey}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-desembarques}
      DB_USERNAME: ${MYSQL_USER:-desembarques_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-desembarques_dev_password}
      FILE_STORAGE_PATH: /var/www/html/storage/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Registro de Desembarques}
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:-60}
      PEDIMENTOS_PDF_PAGE_FROM: ${PEDIMENTOS_PDF_PAGE_FROM:-1}
      PEDIMENTOS_PDF_PAGE_TO: ${PEDIMENTOS_PDF_PAGE_TO:-20}
      PEDIMENTOS_PDFTOTEXT_PATH: /usr/bin/pdftotext
      PEDIMENTOS_TMP_DIR: /tmp/desembarques-pedimentos
      WINDY_API_KEY: ${WINDY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1/login.php"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - desembarques_net

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-3307}:3306"
    environment:
      TZ: ${TZ:-America/Monterrey}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-desembarques}
      MYSQL_USER: ${MYSQL_USER:-desembarques_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-desembarques_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-desembarques_root_dev_password}
    volumes:
      - desembarques_db:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot --password="$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - desembarques_net

  phpmyadmin:
    image: phpmyadmin:5-apache
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - desembarques_net

volumes:
  desembarques_db:

networks:
  desembarques_net:
    driver: bridge
